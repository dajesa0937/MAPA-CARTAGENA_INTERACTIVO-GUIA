<!doctype html>

  <meta property="og:title" content="Cartagena de Indias — Mapa, Historia y Experiencia">
  <meta property="og:description" content="Recorre murallas y fortificaciones, viaja por cinco siglos de historia y camina rutas guiadas. Español e inglés.">
  <meta property="og:type" content="website">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#panel" data-i18n="nav.explore">Explorar</a>

  <header class="topbar" role="banner">
    <button class="brand" id="brandBtn" type="button" aria-label="Cartagena de Indias">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><path d="M4 27V14l4-2V8h3v3h3V6h4v5h3V8h3v4l4 2v13z" fill="currentColor"/><path d="M13 27v-6a3 3 0 0 1 6 0v6" fill="var(--bg-deep)"/></svg>
      </span>
      <span class="brand-text">
        <span class="brand-title" data-i18n="app.brand">Cartagena de Indias</span>
        <span class="brand-sub" data-i18n="app.brandSub">Mapa · Historia · Experiencia</span>
      </span>
    </button>

    <div class="search" role="search">
      <label class="sr-only" for="searchInput" data-i18n="search.label">Buscar lugares y acontecimientos</label>
      <svg class="search-ico" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="searchInput" type="search" autocomplete="off" data-i18n-placeholder="search.placeholder" placeholder="Buscar…" aria-controls="searchResults" aria-expanded="false">
      <div class="search-results" id="searchResults" role="listbox" hidden></div>
    </div>

    <div class="top-actions">
      <button class="icon-btn" id="badgesBtn" type="button" data-i18n-aria="ui.badges" aria-label="Insignias">
        <svg aria-hidden="true"><use href="#i-award"/></svg><span class="badge-dot" id="badgeCount" hidden></span>
      </button>
      <div class="lang" role="group" data-i18n-aria="ui.lang" aria-label="Idioma">
        <button type="button" data-lang="es" aria-pressed="true">ES</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <div id="map" class="map" role="application" aria-label="Mapa de Cartagena de Indias"></div>

    <div class="map-tools" aria-label="Map tools">
      <button class="tool-btn" id="homeBtn" type="button" data-i18n-aria="map.home" aria-label="Centrar"><svg aria-hidden="true"><use href="#i-home"/></svg></button>
      <button class="tool-btn" id="locateBtn" type="button" data-i18n-aria="map.locate" aria-label="Mi ubicación"><svg aria-hidden="true"><use href="#i-locate"/></svg></button>
      <div class="layer-switch">
        <button class="tool-btn" id="layerBtn" type="button" data-i18n-aria="map.layers" aria-label="Capas" aria-expanded="false"><svg aria-hidden="true"><use href="#i-layers"/></svg></button>
        <div class="layer-menu" id="layerMenu" hidden>
          <button type="button" data-layer="sat" data-i18n="map.layer.sat">Satélite</button>
          <button type="button" data-layer="street" data-i18n="map.layer.voyager">Mapa</button>
          <button type="button" data-layer="osm" data-i18n="map.layer.osm">Detalle</button>
        </div>
      </div>
    </div>

    <aside class="panel" id="panel" aria-live="polite" tabindex="-1">
      <button class="sheet-handle" id="sheetHandle" type="button" data-i18n-aria="ui.expand" aria-label="Expandir panel"><span></span></button>
      <nav class="tabs" role="tablist">
        <button role="tab" type="button" data-tab="explore" aria-selected="true"><svg aria-hidden="true"><use href="#i-compass"/></svg><span data-i18n="nav.explore">Explorar</span></button>
        <button role="tab" type="button" data-tab="history" aria-selected="false"><svg aria-hidden="true"><use href="#i-hourglass"/></svg><span data-i18n="nav.history">Historia</span></button>
        <button role="tab" type="button" data-tab="routes" aria-selected="false"><svg aria-hidden="true"><use href="#i-route"/></svg><span data-i18n="nav.routes">Rutas</span></button>
        <button role="tab" type="button" data-tab="about" aria-selected="false"><svg aria-hidden="true"><use href="#i-book"/></svg><span data-i18n="nav.about">Fuentes</span></button>
      </nav>
      <div class="panel-body" id="panelBody">
        <p class="loading" data-i18n="ui.loading">Cargando la historia de Cartagena…</p>
      </div>
    </aside>

    <section class="timebar" id="timebar" hidden aria-label="Línea de tiempo">
      <div class="timebar-row">
        <button class="icon-btn small tb-play" id="playBtn" type="button" data-i18n-aria="history.play" aria-label="Reproducir"><svg aria-hidden="true"><use href="#i-play"/></svg></button>
        <div class="timebar-year">
          <span class="yr" id="yearLabel">1741</span>
          <span class="tb-meta"><span class="per" id="periodLabel"></span><span class="rng" id="periodRange"></span></span>
        </div>
        <div class="tb-nav">
          <button class="icon-btn small" id="prevPeriodBtn" type="button" data-i18n-aria="history.prev" aria-label="Época anterior"><svg aria-hidden="true"><use href="#i-back"/></svg></button>
          <button class="icon-btn small flip" id="nextPeriodBtn" type="button" data-i18n-aria="history.next" aria-label="Época siguiente"><svg aria-hidden="true"><use href="#i-back"/></svg></button>
          <button class="icon-btn small" id="exitHistoryBtn" type="button" data-i18n-aria="history.exit" aria-label="Salir"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
        </div>
      </div>
      <div class="tl">
        <div class="tl-events" id="tlEvents"></div>
        <div class="tl-bands" id="tlBands"></div>
        <input type="range" class="tl-range" id="yearSlider" min="1500" max="2026" step="1" value="1741" aria-describedby="yearLabel" data-i18n-aria="history.year">
        <div class="tl-ends"><span>1500</span><span data-i18n="history.today">Hoy</span></div>
      </div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </main>

  <div class="hero" id="hero" role="dialog" aria-modal="true" aria-labelledby="heroTitle">
    <div class="hero-bg" aria-hidden="true"><img id="heroImg" alt="" fetchpriority="high" decoding="async"></div>
    <div class="hero-inner">
      <div class="hero-top">
        <span class="hero-brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 27V14l4-2V8h3v3h3V6h4v5h3V8h3v4l4 2v13z" fill="currentColor"/></svg><span data-i18n="app.brandSub">Mapa · Historia · Experiencia</span></span>
        <div class="lang hero-lang" role="group" aria-label="Idioma / Language">
          <button type="button" data-lang="es" aria-pressed="true">ES</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
      <div class="hero-copy">
        <p class="hero-kicker" data-i18n="hero.kicker">Patrimonio de la Humanidad · UNESCO 1984</p>
        <h1 id="heroTitle" data-i18n="hero.title">Cartagena de Indias</h1>
        <p class="hero-sub" data-i18n="hero.subtitle">Descubre la ciudad. Recorre sus calles. Conoce su historia.</p>
        <div class="hero-actions">
          <button class="btn primary big" type="button" data-go="explore"><svg aria-hidden="true"><use href="#i-compass"/></svg><span data-i18n="hero.explore">Explorar Cartagena</span></button>
          <button class="btn glass big" type="button" data-go="history"><svg aria-hidden="true"><use href="#i-hourglass"/></svg><span data-i18n="hero.history">Viajar por la historia</span></button>
          <button class="btn glass big" type="button" data-go="routes"><svg aria-hidden="true"><use href="#i-route"/></svg><span data-i18n="hero.route">Comenzar recorrido</span></button>
        </div>
        <div class="hero-quick">
          <button type="button" class="chip glass" data-go="forts"><svg aria-hidden="true"><use href="#i-castillo"/></svg><span data-i18n="hero.forts">Fortificaciones</span></button>
          <button type="button" class="chip glass" data-go="routes"><svg aria-hidden="true"><use href="#i-route"/></svg><span data-i18n="hero.routes">Rutas</span></button>
          <button type="button" class="chip glass" data-go="history"><svg aria-hidden="true"><use href="#i-hourglass"/></svg><span data-i18n="hero.timeline">Línea de tiempo</span></button>
        </div>
      </div>
      <section class="hero-strip" aria-labelledby="mustTitle">
        <h2 id="mustTitle" data-i18n="hero.must">Imprescindibles</h2>
        <div class="hero-cards" id="heroCards"></div>
      </section>
      <p class="hero-note"><span data-i18n="hero.note">Cada dato lleva su fuente y su nivel de certeza.</span> <span class="hero-credit" id="heroCredit"></span></p>
    </div>
  </div>

  <dialog class="viewer" id="viewer" aria-label="Vistas">
    <div class="viewer-stage">
      <div class="viewer-bg" id="viewerBg" aria-hidden="true"></div>
      <img id="viewerImg" alt="">
      <button class="viewer-btn prev" type="button" data-v="-1" data-i18n-aria="gallery.prev" aria-label="Anterior"><svg aria-hidden="true"><use href="#i-back"/></svg></button>
      <button class="viewer-btn next" type="button" data-v="1" data-i18n-aria="gallery.next" aria-label="Siguiente"><svg aria-hidden="true"><use href="#i-back"/></svg></button>
    </div>
    <div class="viewer-top">
      <div><strong id="viewerTitle"></strong><span id="viewerCount"></span></div>
      <div class="viewer-actions">
        <button class="icon-btn" type="button" id="viewerPlay" data-i18n-aria="gallery.play" aria-label="Recorrido"><svg aria-hidden="true"><use href="#i-play"/></svg></button>
        <button class="icon-btn" type="button" data-vclose data-i18n-aria="ui.close" aria-label="Cerrar"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
      </div>
    </div>
    <div class="viewer-bottom">
      <p id="viewerCap"></p>
      <div class="viewer-thumbs" id="viewerThumbs"></div>
    </div>
  </dialog>

  <dialog class="modal" id="badgesModal" aria-labelledby="badgesTitle">
    <div class="modal-head">
      <h2 id="badgesTitle" data-i18n="badges.title">Descubre Cartagena</h2>
      <button class="icon-btn" type="button" data-close data-i18n-aria="ui.close" aria-label="Cerrar"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <p class="muted" data-i18n="badges.intro"></p>
    <div id="badgesList" class="badges"></div>
  </dialog>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
